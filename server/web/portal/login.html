<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>AION</title>
  <!-- Self-contained sign-in landing served to anonymous visitors by the
       portal gate (server/portal.go). No external / gated dependencies: the
       whole portal is behind auth, so this page inlines everything and the
       Alchimia display face falls back to serif when the (gated) font can't
       load. -->
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: #262626; color: #d4d4d4;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 24px;
    }
    .login-box {
      width: 420px; max-width: 100%;
      border: 1px solid #3a3a3a; background: #262626;
      display: flex; flex-direction: column; align-items: center;
      gap: 28px; padding: 60px 24px;
    }
    .login-wordmark { text-align: center; }
    .login-title {
      font-family: 'Alchimia', 'Times New Roman', serif;
      font-size: 36px; letter-spacing: 8px; color: #d4d4d4; line-height: 1;
    }
    .login-sub {
      font-size: 12px; color: #888; letter-spacing: 3px;
      margin-top: 10px; text-transform: lowercase;
    }
    .login-btn {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px; letter-spacing: 0.5px;
      text-decoration: none; color: #d4d4d4;
      background: transparent; border: 1px solid #3a3a3a;
      padding: 12px 30px; cursor: pointer;
      transition: border-color .15s ease, color .15s ease;
    }
    .login-btn:hover, .login-btn:focus-visible {
      color: #fff; border-color: #999; outline: none;
    }
    .login-foot { font-size: 11px; color: #555; letter-spacing: 0.3px; }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="login-wordmark">
      <div class="login-title">AION</div>
      <div class="login-sub">portal</div>
    </div>
    <a class="login-btn" href="/oauth2/login?switch=1">Sign in</a>
    <div class="login-foot">@aion.bio accounts only</div>
  </div>
</body>
</html>
